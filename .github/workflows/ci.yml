name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Database tests against real Postgres
        run: npx vitest run --no-file-parallelism tests/db.test.ts tests/server.test.ts tests/import.test.ts tests/bot.test.ts tests/campaigns.test.ts tests/connections.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bp_test
          DATABASE_SSL: disable
      - run: npm run n8n:check
      - run: npm run build
